# Entorno local completo de ASPAR: PostgreSQL 16 + API FastAPI + Frontend Vue.
#
#   docker compose up --build      -> http://localhost:5173 (web) y http://localhost:8000/docs (API)
#   docker compose down            -> detiene todo (los datos se conservan)
#   docker compose down -v         -> detiene todo y BORRA la base local
#
# Solo para desarrollo: las claves de este archivo no sirven en producción.
# Producción usa Supabase (base) y Google Cloud Run (API) con secretos propios.

name: aspar

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aspar
      POSTGRES_PASSWORD: aspar_local
      POSTGRES_DB: aspar
    ports:
      # 5433 en tu PC para no chocar con un PostgreSQL instalado localmente
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aspar -d aspar"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./Backend
      target: dev
    env_file:
      # Opcional: claves propias de desarrollo (por ejemplo SUPABASE_*). Las variables
      # de "environment" tienen prioridad, así la API siempre usa la base de Docker.
      - path: ./Backend/.env
        required: false
    environment:
      ENV: dev
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://aspar:aspar_local@db:5432/aspar
      MIGRATION_DATABASE_URL: postgresql://aspar:aspar_local@db:5432/aspar
      TEST_DATABASE_URL: postgresql://aspar:aspar_local@db:5432/aspar_test
      JWT_SECRET: solo-desarrollo-local-no-usar-en-produccion-aspar
      # 5173: el frontend. 8000: Swagger (/docs), para poder iniciar sesión desde ahí
      CORS_ORIGINS: http://localhost:5173,http://localhost:8000
      # En tu PC la API va por http: las cookies no pueden ser Secure
      COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    # Se monta el repositorio completo: las pruebas de contrato leen Frontend/ y docs/
    volumes:
      - ./:/repo
    working_dir: /repo/Backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: node:22-alpine
    working_dir: /app
    # Instala dependencias solo si package-lock.json cambió desde la última vez
    command:
      - sh
      - -c
      - >-
        if ! cmp -s package-lock.json node_modules/.package-lock.json.docker; then
        npm ci && cp package-lock.json node_modules/.package-lock.json.docker; fi
        && exec npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      # Docker Desktop en Windows no avisa los cambios de archivos: Vite los revisa por sondeo
      WATCH_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      # node_modules vive en un volumen de Docker, separado del de tu PC
      - web-node-modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  web-node-modules:
