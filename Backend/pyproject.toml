[project]
name = "aspar-backend"
version = "1.0.0"
description = "API REST FastAPI del sistema ASPAR (Soluna Solutions)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM"]
ignore = [
    "B008",  # Depends(...) en argumentos es el patrón estándar de FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]
# Errores de dominio con nombres cortos y legibles (NotFound, Conflict, Forbidden...)
"app/core/errors.py" = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]
