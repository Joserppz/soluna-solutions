name: ASPAR CI/CD — Frontend Lint, Tests & Build (SCRUM-61 / SCRUM-96)

# El Backend tiene su propio pipeline: .github/workflows/ci-backend.yml (SCRUM-95)

on:
  push:
    branches:
      - main
      - 'Sprint*'
      - 'SCRUM-*'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'Sprint*'

jobs:
  frontend-quality-and-build:
    name: Validar ESLint, Prettier, TypeScript, Vitest y Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Instalar dependencias del Frontend
        run: npm ci

      - name: Preparar archivo .env desde .env.example
        run: cp .env.example .env

      - name: Ejecutar análisis estático con ESLint (SCRUM-153)
        run: npm run lint

      - name: Verificar que los tipos de la API coinciden con docs/api/openapi.json
        run: npm run api:types:check

      - name: Auditar dependencias con npm audit
        # Producción (vue, vue-router): cualquier vulnerabilidad moderada o mayor bloquea.
        # Herramientas de desarrollo: bloquean las altas y críticas.
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=high

      - name: Verificar formato de código con Prettier
        run: npx prettier --check src/ scripts/ eslint.config.mjs vite.config.ts vitest.config.ts

      - name: Ejecutar pruebas con Vitest y medir cobertura (SCRUM-153 / SCRUM-97)
        run: npm run test:coverage

      - name: Registrar cobertura en el resumen del pipeline (SCRUM-97)
        if: always()
        run: |
          node -e "
          const t = require('./coverage/coverage-summary.json').total;
          const row = (k, n) => '| ' + n + ' | ' + t[k].pct + '% | ' + t[k].covered + '/' + t[k].total + ' |';
          console.log(['### Cobertura del Frontend (mínimo 70%)', '', '| Métrica | Cobertura | Cubierto |', '| :--- | ---: | ---: |',
            row('lines', 'Líneas'), row('statements', 'Sentencias'), row('functions', 'Funciones'), row('branches', 'Ramas')].join('\\n'));
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: Frontend/coverage/

      - name: Compilar aplicación y verificar tipos TypeScript (SCRUM-96)
        run: npm run build
