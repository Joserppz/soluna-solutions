name: ASPAR CI/CD — Frontend Lint, Tests & Build (SCRUM-61 / SCRUM-96)

# El Backend tiene su propio pipeline: .github/workflows/ci-backend.yml (SCRUM-95)

on:
  push:
    branches:
      - main
      - 'Sprint*'
      - 'SCRUM-*'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'Sprint*'

jobs:
  frontend-quality-and-build:
    name: Validar ESLint, Prettier, TypeScript, Vitest y Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Instalar dependencias del Frontend
        run: npm ci

      - name: Preparar archivo .env desde .env.example
        run: cp .env.example .env

      - name: Ejecutar análisis estático con ESLint (SCRUM-153)
        run: npm run lint

      - name: Verificar formato de código con Prettier
        run: npx prettier --check src/ eslint.config.mjs vite.config.ts vitest.config.ts

      - name: Ejecutar pruebas unitarias y de componentes con Vitest (SCRUM-153)
        run: npm run test:run

      - name: Compilar aplicación y verificar tipos TypeScript (SCRUM-96)
        run: npm run build
