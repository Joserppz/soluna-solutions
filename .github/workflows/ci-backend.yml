name: ASPAR CI/CD — Backend Lint, Migraciones y Pruebas de API (SCRUM-61 / SCRUM-95)

on:
  push:
    branches:
      - main
      - 'Sprint*'
      - 'SCRUM-*'
      - 'feature/**'
    paths:
      - 'Backend/**'
      - 'Frontend/src/types/**'
      - 'docs/api/openapi.json'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches:
      - main
      - 'Sprint*'
    paths:
      - 'Backend/**'
      - 'Frontend/src/types/**'
      - 'docs/api/openapi.json'
      - '.github/workflows/ci-backend.yml'

jobs:
  backend-quality-and-api-tests:
    name: Ruff, migraciones y pytest contra PostgreSQL 16
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aspar
          POSTGRES_PASSWORD: aspar_ci
          POSTGRES_DB: aspar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aspar -d aspar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://aspar:aspar_ci@localhost:5432/aspar_test
      MIGRATIONS_DATABASE_URL: postgresql://aspar:aspar_ci@localhost:5432/aspar_migraciones

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Backend/requirements-dev.txt

      - name: Instalar dependencias del Backend
        run: pip install -r requirements-dev.txt

      - name: Auditar dependencias de ejecución con pip-audit
        # Falla si alguna versión de requirements.txt tiene una vulnerabilidad conocida
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off

      - name: Analizar código con Ruff
        run: ruff check . --output-format=github

      - name: Verificar formato con Ruff
        run: ruff format --check .

      - name: Aplicar migraciones versionadas sobre una base vacía
        run: |
          psql "postgresql://aspar:aspar_ci@localhost:5432/aspar_test" -c "create database aspar_migraciones"
          DATABASE_URL="$MIGRATIONS_DATABASE_URL" JWT_SECRET="ci-secreto-solo-para-migraciones-aspar" python -m scripts.migrate
          DATABASE_URL="$MIGRATIONS_DATABASE_URL" JWT_SECRET="ci-secreto-solo-para-migraciones-aspar" python -m scripts.migrate --status

      - name: Ejecutar pruebas con pytest y medir cobertura (SCRUM-97)
        run: >-
          pytest --junitxml=pytest-report.xml
          --cov=app --cov-report=term-missing --cov-report=xml --cov-report=markdown-append:cobertura.md
          --cov-fail-under=70

      - name: Registrar cobertura en el resumen del pipeline (SCRUM-97)
        if: always()
        run: |
          echo "### Cobertura del Backend (mínimo 70%)" >> "$GITHUB_STEP_SUMMARY"
          cat cobertura.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-report
          path: |
            Backend/pytest-report.xml
            Backend/coverage.xml

  docker-image:
    name: Imagen Docker de producción (runtime)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Construir la imagen runtime (la que se despliega en Cloud Run)
        run: docker build --target runtime --tag aspar-api:ci Backend

      - name: Construir la imagen de desarrollo (docker compose)
        run: docker build --target dev --tag aspar-api:dev Backend

      - name: Probar que la imagen arranca sin root y rechaza una configuración insegura
        run: |
          SECRET="ci-$(openssl rand -hex 24)"
          docker run --rm -e DATABASE_URL=postgresql://ci:ci@localhost/ci -e JWT_SECRET="$SECRET" \
            aspar-api:ci python -c "import os; from app.main import app; assert os.getuid() != 0; print('OK', len(app.routes), 'rutas')"
          # Con ENV=prod y valores de desarrollo la API no debe arrancar
          if docker run --rm -e ENV=prod -e DATABASE_URL=postgresql://ci:ci@localhost/ci -e JWT_SECRET="$SECRET" \
            aspar-api:ci python -c "import app.main" 2>/dev/null; then
            echo "La imagen arrancó en producción con configuración insegura" && exit 1
          fi
