name: ASPAR — Respaldo diario cifrado (base y documentos)

# Listo para activar: hoy solo corre a mano (Actions → este workflow → Run workflow).
# Cuando estén los secretos de producción, quitar el comentario de «schedule».
# Pasos y secretos: docs/despliegue/GUIA_DE_DESPLIEGUE.md, sección 8.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '7 7 * * *'   # 03:07 en Bolivia (UTC-4), todos los días

permissions:
  contents: read

concurrency:
  group: respaldo
  cancel-in-progress: false

jobs:
  backup:
    name: pg_dump + documentos, cifrado con la clave pública
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Backend
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PUBLIC_KEY: ${{ secrets.BACKUP_PUBLIC_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Supabase usa PostgreSQL 17: pg_dump debe ser de la misma versión o más nueva
      PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump

    steps:
      - name: Revisar que los secretos estén configurados
        run: |
          missing=""
          for name in BACKUP_DATABASE_URL BACKUP_PUBLIC_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltan los secretos:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Backend/requirements.txt

      - name: Instalar dependencias del script
        run: pip install -r requirements.txt

      - name: Instalar pg_dump 17 (repositorio oficial de PostgreSQL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          "$PG_DUMP" --version

      - name: Generar el respaldo cifrado
        run: python -m scripts.backup_db create --output ../respaldos --with-documents

      - name: Guardar el respaldo (30 días)
        uses: actions/upload-artifact@v4
        with:
          name: aspar-respaldo-${{ github.run_number }}
          path: respaldos/*.enc
          retention-days: 30
          if-no-files-found: error
